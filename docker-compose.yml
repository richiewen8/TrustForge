services:
  trustforge:
    container_name: trustforge
    hostname: trustforge
    image: trustforge:local
    build:
      context: ..
      dockerfile: TrustForge/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__TrustForge: Host=postgres;Port=5432;Database=trustforge;Username=trustforge;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Authentication__Authority: ${TRUSTFORGE_OIDC_AUTHORITY:?Set TRUSTFORGE_OIDC_AUTHORITY in .env}
      Authentication__Audience: ${TRUSTFORGE_OIDC_AUDIENCE:?Set TRUSTFORGE_OIDC_AUDIENCE in .env}
      DnsServer__Enabled: "true"
      DnsServer__ConfigDirectory: /etc/trustforge/dns
    ports:
      - "${TRUSTFORGE_API_PORT:-5000}:5000/tcp"
      - "${TRUSTFORGE_DNS_UI_BIND:-127.0.0.1}:${TRUSTFORGE_DNS_UI_PORT:-5380}:5380/tcp"
      - "${TRUSTFORGE_DNS_PORT:-53}:53/udp"
      - "${TRUSTFORGE_DNS_PORT:-53}:53/tcp"
      # Optional DNS encryption and DHCP ports; publish only when configured and required.
      # - "853:853/udp"
      # - "853:853/tcp"
      # - "443:443/udp"
      # - "443:443/tcp"
      # - "67:67/udp"
    volumes:
      - trustforge-dns-config:/etc/trustforge/dns
      - trustforge-dns-logs:/var/log/technitium/dns
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    container_name: trustforge-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: trustforge
      POSTGRES_USER: trustforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - trustforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustforge -d trustforge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  trustforge-dns-config:
  trustforge-dns-logs:
  trustforge-postgres-data:
